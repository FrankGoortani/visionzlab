<script type="application/json" id="case">{"slug":"agency-brief-intake","title":"Client brief intake","tagline":"A new project arrives as a client email, a kickoff call and a brand guide. The assistant builds the structured brief, lists the open questions and drafts the deliverables list. The account lead confirms it with the client.","area":"Account management","flow":{"start":"Client emails, call notes and brand documents","agent":"Builds the brief, lists open questions, drafts the deliverables list","person":"Confirms scope, budget and dates with the client","end":"A confirmed brief and a project set up for the team"},"persona":{"name":"Maya Lindgren","role":"Account lead"},"docs":[{"name":"New launch - Thistlewick Bakery.eml","kind":"email","body":"Hi Maya,\n\nAs discussed, we're launching our [[frozen pastry line|Project]] in grocery stores on [[Monday 1 March|Launch date]].\n\nWhat we think we need:\n- a [[30-second launch video|Video]], plus a shorter cut for social\n- [[6 social posts|Social posts]] for launch week\n- an [[in-store poster|Poster]] for Marrowbank Grocers\n- copy for a [[landing page|Landing page]] on our site\n\nBudget is [[around $40,000|Budget]]. We'd like to see the video in store screens [[a week before launch|Video due]].\n\nThanks!\nHanna Osei\nMarketing manager, Thistlewick Bakery Co.","meta":"Email · Wed 25 Nov 08:40","to":"hello@acme-studio.example","subject":"Spring launch: frozen pastry line","label":"Thistlewick Bakery · email","sub":"Client email · scope and dates","fields":[["Client","Thistlewick Bakery Co. (client 0417)","Sender domain, client list"],["Project","Frozen pastry line, grocery launch","Email text",0.97],["Launch date","Mon 1 Mar 2027","Email text",0.95],["Video","30 s launch video + 15 s cut for social","Email text",0.9],["Social posts","6 posts, launch week","Email text",0.96],["Poster","In-store poster, Marrowbank Grocers spec","Email text, retailer sheet",0.93],["Landing page","Copy only; client's team builds the page","Email text, call notes",0.85],["Budget","$40,000 (scope in question, see call notes)","Email text",0.8],["Video due","Mon 22 Feb 2027","Email text: a week before launch",0.9]],"table":{"title":"Checks","h":["Check","Brief","Your planning rules"],"r":[["Deliverables named","5 groups, 11 items","Each one sized","ok"],["Budget stated","$40,000","Scope of budget unclear","check"],["Video timeline","Due Mon 22 Feb","10 weeks from script approval, plus the studio's holiday closure: script approved by Mon 7 Dec","bad"]]},"flags":[["bad","The video needs an approved script by Mon 7 Dec, under two weeks from today. The account lead decides whether to propose a later video date or a faster plan."],["info","The assistant drafts the deliverables list only. Estimates and the fee are set by the account lead."]],"yes":"Confirm brief items","from":"h.osei@thistlewick-bakery.example"},{"name":"Kickoff call - Thistlewick.txt","kind":"call","body":"Attendees: Hanna Osei (Thistlewick), Maya Lindgren, Joel Pratt (Acme Studio)\n\n- Product: four flavours, [[sold in the freezer aisle|Channel]], first time outside their own cafés.\n- Audience: Hanna said '[[busy families]]', later '[[people who already know our cafés|Audience]]'.\n- Budget: Hanna thinks the $40k [[has to cover the paid social boost too|Budget scope]], will check with finance.\n- Must-haves: [[show all four flavours|Mandatory]]; no 'artisan' wording on frozen items.\n- Approvals: Hanna plus the owner; [[two weeks per round|Client review time]] over the holidays.","meta":"Call notes · Tue 24 Nov · 35 min","label":"Kickoff call notes","sub":"Call notes · budget and audience","fields":[["Channel","Grocery freezer aisle, first retail launch","Call notes",0.94],["Audience","?Busy families, or existing café customers","Two answers on the call",0.45],["Budget scope","?Production only, or production plus paid social","Client to check with finance",0.4],["Mandatory","Show all four flavours; no 'artisan' wording","Call notes, brand guide",0.92],["Client review time","2 weeks per round in December","Call notes",0.88]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Audience agreed","Two different answers","check"],["Budget covers media?","Not confirmed","check"],["Approvers named","Marketing manager and owner","ok"]]},"flags":["Two weeks per review round in December makes the 7 Dec script date harder. Listed as an open question, not decided.","The audience is left open rather than picked: it changes the video concept."]},{"name":"Thistlewick brand guide v3.pdf","kind":"pdf","body":"THISTLEWICK BAKERY CO. · BRAND GUIDE v3\n\nColours: [[Oat #E9DCC3, Plum #5B2A4A|Colours]]\nType: [[Fenwick Serif for headlines, a plain sans for body|Typeface]]\nVoice: [[warm, plain, a little cheeky|Voice]]\nLogo: vector files on page 12; [[clear space = height of the 'T'|Logo rule]]\nNever: [[call frozen products 'artisan'|Restriction]]; never show the logo on a busy photo.","meta":"PDF · 14 pages","label":"Brand guide v3","sub":"Brand guide · clean","fields":[["Colours","Oat #E9DCC3, Plum #5B2A4A","Page 3"],["Typeface","Fenwick Serif headlines, plain sans body","Page 5"],["Voice","Warm, plain, a little cheeky","Page 7"],["Logo rule","Clear space = height of the 'T'","Page 12"],["Restriction","No 'artisan' wording on frozen products","Page 13"]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Vector logo files","Included, page 12","ok"],["Agrees with call notes","Same 'artisan' rule","ok"],["Version","v3, current","ok"]]},"notes":"Everything the team needs from the guide is captured. No questions.","yes":"Confirm brief items"},{"name":"Marrowbank Grocers - poster spec.pdf","kind":"pdf","body":"MARROWBANK GROCERS · IN-STORE SUPPLIER POSTERS\n\nSizes: [[24 x 36 in and 11 x 17 in|Sizes]]\nFile: print-ready PDF, 3 mm bleed\nArtwork due: [[6 weeks before in-store date|Artwork rule]]\nApproval: Marrowbank category team, allow [[5 business days|Retailer review]]","meta":"PDF · 2 pages · retailer sp oes the $40,000 include the [[paid social boost]], or is it production only?\n3. Dates: to have the video ready by 22 Feb we'd need an approved script by [[Monday 7 December]]. Would a later video date work, or can we plan shorter review rounds in December?\n\nOnce we hear back we'll send the full brief and estimate.\n\nMaya","title":"Questions for the client","sub":"Built from the open questions. The account lead edits and sends it.","to":"Hanna Osei","subject":"Thistlewick launch brief: three questions","label":"Email to client","alt":["Hi Hanna,\n\nWe're nearly ready to send the brief. Three things to confirm: the main [[audience]], whether the budget covers [[paid social]], and the video date, since 22 Feb needs a script approved by [[7 December]].\n\nMaya"]},{"type":"write","system":"Project management system (test copy)","records":[{"title":"Project THW-2701 · Thistlewick frozen pastry launch","kv":[["Client","Thistlewick Bakery Co."],["Launch","Mon 1 Mar 2027"],["Owner","Maya Lindgren"]],"status":"Project created","tone":"ok"},{"title":"Deliverables list · 11 items","kv":[["Video","2"],["Social","6"],["Print","2"],["Web copy","1"]],"status":"Draft list saved","tone":"check","note":"Hours and fees are added by the account lead."},{"title":"Milestone · script approval","kv":[["Date","Mon 7 Dec, as proposed"],["Status","Waiting on client answer"]],"status":"Saved, waiting","tone":"check"},{"title":"Task · send three questions","kv":[["Assigned","Maya Lindgren"],["Due","Wed 25 Nov"]],"status":"Task created","tone":"info"}],"title":"Update the system","sub":"Only the brief items the account lead confirmed are written.","cta":"Save to the project system"},{"type":"report","doc":"Creative brief · Thistlewick frozen pastry launch","sections":[{"h":"Objective","p":"Launch a four-flavour frozen pastry line in grocery freezer aisles from Monday 1 March 2027, the brand's first retail launch."},{"h":"Deliverables","table":{"title":null,"h":["Deliverable","Items","Due","No
