<script type="application/json" id="case">{"slug":"saas-support-triage","title":"Support ticket triage","tagline":"Tickets and chat transcripts arrive all day. The assistant tags the product area and severity, links duplicates and known issues, and drafts a reply. A support agent checks and sends every reply.","area":"Customer support","flow":{"start":"Support tickets and chat transcripts","agent":"Tags area and severity, links duplicates and known issues, drafts replies","person":"Checks severity, edits and sends every reply","end":"A triaged queue in the helpdesk"},"persona":{"name":"Theo Lindgren","role":"Support team lead"},"docs":[{"name":"Ticket 48211 - CSV export times out.eml","kind":"email","body":"Hi,\n\nWhen I [[export the orders report to CSV|Product area]], it spins and then says [[\"request timed out\"|Symptom]]. It's about [[80,000 rows|Size]] for the year. Smaller exports work fine.\n\nWe need it for month end on Monday.\n\nJ. Whitcombe\nMarlow Outfitters","meta":"Ticket · today 07:58","to":"support@acme-cloud.example","subject":"Export keeps timing out","label":"Marlow Outfitters · 48211","sub":"Reporting · known issue","fields":[["Customer","Marlow Outfitters (Business plan)","Sender domain, account record",0.99],["Product area","Reporting · exports","Email text",0.96],["Symptom","Export times out","Email text",0.97],["Size","About 80,000 rows","Email text",0.9],["Severity","S3: one feature, workaround exists","Your severity guide",0.9],["Known issue","KI-112: exports over 50,000 rows time out","Known issues list",0.95]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Matches a known issue","KI-112, fix planned for release 4.19","ok"],["Workaround on file","Export by quarter, then combine","ok"],["Customer deadline","Month end, Monday","info"]]},"draft":{"text":"Hi J.,\n\nThanks for the detail. This is a known issue with exports over 50,000 rows, and a fix is planned. Until then, exporting [[one quarter at a time]] works, and the four files can be combined.\n\nI've linked your ticket to the issue, so you'll hear from us when the fix is out.\n\nTheo","label":"Reply to customer","alt":["Hi J.,\n\nYou've hit a known limit on large exports. For Monday, please export [[one quarter at a time]]; we'll let you know as soon as the fix ships.\n\nTheo"],"to":"J. Whitcombe"},"yes":"Send reply","from":"admin@marlow-outfitters.example"},{"name":"Chat transcript - Sunfield Rentals.txt","kind":"call","body":"08:21 Visitor (D. Kaur, Sunfield Rentals): we changed our [[single sign-on settings|Product area]] last night and now I [[can't log in|Symptom]]\n08:22 Bot: Sorry about that. Is anyone else on your team affected?\n08:24 Visitor: [[not sure, it's early here|Scope]]\n08:24 Visitor: our admin made the change, he's off today\n08:25 Bot: Thanks. A support agent will follow up by email.","meta":"Chat · today 08:21","label":"Sunfield Rentals · chat","sub":"Sign-in · severity unclear","fields":[["Customer","Sunfield Rentals (Enterprise plan)","Chat account link",0.98],["Product area","Sign-in · single sign-on","Chat text",0.95],["Symptom","User can't sign in after an SSO change","Chat text",0.95],["Scope","?One user or the whole company: unknown","Chat text",0.35],["Severity","?S1 if nobody can sign in, S3 if one user","Your severity guide",0.4]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Matches a known issue","None","info"],["Recent SSO change on the account","Yes, settings saved 22:47 last night","check"],["Other sign-in tickets from this customer today","None yet","info"]]},"flags":["Severity depends on how many people are locked out. The assistant didn't pick one; a support agent decides.",["info","Enterprise plan: an S1 pages the on-call engineer under your support policy."]],"draft":{"text":"Hi D.,\n\nThanks for reaching out. To help quickly, could you tell us [[whether anyone on your team can sign in]]? Your admin can also sign in with the backup admin login while we look at the single sign-on settings.\n\nTheo","label":"Reply to customer","alt":[],"to":"D. Kaur"},"yes":"Send reply"},{"name":"Ticket 48219 - Charged twice.eml","kind":"email","body":"Hello,\n\nOur card was [[charged twice|Symptom]] for the November subscription, [[$420.00|Amount]] each time on [[1 Nov|Date]]. Please refund one of them.\n\nAccounts, Pemberton Tiles","meta":"Ticket · today 09:10","to":"support@acme-cloud.example","subject":"Charged twice for November","label":"Pemberton Tiles · 48219","sub":"Billing · route to billing","fields":[["Customer","Pemberton Tiles (Team plan)","Sender domain, account record",0.98],["Product area","Billing","Email text",0.99],["Symptom","Two charges for one month","Email text",0.97],["Amount","$420.00 x 2","Email text, billing record",0.97],["Severity","S3: billing, routed to billing team","Your severity guide",0.92]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Billing record","Two charges of $420.00 on 1 Nov","check"],["Refund decision","Billing team only","info"]]},"flags":[["info","Refunds are decided by the billing team. The draft acknowledges the ticket and doesn't promise a refund."]],"draft":{"text":"Hello,\n\nThanks for letting us know. We can see two charges of $420.00 on 1 November, and our [[billing team]] is looking at it now. They'll reply to you directly.\n\nTheo, Acme Cloud support","label":"Reply to customer","alt":[],"to":"Pemberton Tiles accounts"},"yes":"Send reply","from":"accounts@pemberton-tiles.example"},{"name":"Ticket 48224 - Report download fails.eml","kind":"email","body":"Hi support,\n\nDownloading the [[annual sales report|Product area]] as a spreadsheet fails with [[a timeout|Symptom]]. The monthly one works.\n\nThanks,\nOps team, Greyling Cafés","meta":"Ticket · today 09:32","to":"support@acme-cloud.example","subject":"Annual report download fails","label":"Greyling Cafés · 48224","sub":"Duplicate of KI-112","fields":[["Customer","Greyling Cafés (Business plan)","Sender domain, account record",0.98],["Product area","Reporting · exports","Email text",0.93],["Symptom","Large export times out","Email text",0.94],["Known issue","KI-112 (same as ticket 48211)","Known issues list",0.9],["Severity","S3: workaround exists","Your severity guide",0.9]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Duplicate of","Ticket 48211 (Marlow Outfitters) and KI-112","ok"],["Accounts hit by KI-112 this week","3","check"]]},"flags":["Three accounts have hit KI-112 this week. Your rule escalates a known issue to engineering at three accounts."],"draft":{"text":"Hi,\n\nThanks for the report. Large exports are a known issue and a fix is planned. For now, please download [[one quarter at a time]]. We'll tell you when the fix is out.\n\nTheo","label":"Reply to customer","alt":[],"to":"Greyling Cafés ops"},"yes":"Send reply","from":"ops@greyling-cafes.example"},{"name":"Ticket 48230 - Webhooks failing.eml","kind":"email","body":"Since [[about 23:00 last night|Started]], every [[webhook|Product area]] call from your side to our system shows [[401 Unauthorized|Symptom]]. We didn't change anything. Our dispatch board is not updating.\n\nM. Osei, developer, Brindle Logistics","meta":"Ticket · today 09:47","to":"support@acme-cloud.example","subject":"URGENT webhooks returning 401","label":"Brindle Logistics · 48230","sub":"Integrations · possible incident","fields":[["Customer","Brindle Logistics (Enterprise plan)","Sender domain, account record",0.98],["Product area","Integrations · webhooks","Email text",0.96],["Symptom","Webhook calls rejected with 401","Email text",0.96],["Started","About 23:00 last night","Email text",0.85],["Known issue","?None. Release 4.18 went out at 22:30 and changed webhook signing","Release notes 4.18",0.45],["Severity","S2: core workflow down, one customer so far","Your severity guide",0.7]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Matches a known issue","None","bad"],["Recent release","4.18 at 22:30, webhook signing changed","check"],["Other webhook tickets today","None yet","info"]]},"flags":[["bad","No known issue matches, and the timing fits last night's release. Held for the on-call engineer before any reply explains a cause."],"The assistant doesn't say the release caused it. That's for engineering to confirm."],"draft":{"text":"Hi M.,\n\nThanks for the clear report. We're looking into the webhook errors now with our engineering team, and we'll update you [[within the hour]].\n\nTheo","label":"Holding reply to customer","alt":[],"to":"M. Osei"},"yes":"Send reply","from":"dev@brindle-logistics.example"}],"stages":[{"type":"upload","mode":"inbox","source":"Support queue","title":"New tickets and chats","sub":"Emails, chat transcripts and form tickets arrive in the support queue."},{"type":"process","title":"Processing","sub":"","steps":[["Reading each ticket","Emails and chat transcripts"],["Tagging product area","From your product area list"],["Suggesting severity","From your severity guide; unclear ones are left for a person"],["Linking duplicates and known issues","Known issues list and today's tickets"],["Drafting replies","With the approved workaround where one exists. Nothing is sent"]],"log":[["48211 and 48224 linked to KI-112","g",3],["KI-112 reached 3 accounts this week","y",3],["Sunfield chat: severity unclear, left for an agent","y",2],["48230: no known issue, release 4.18 shipped 22:30","y",3]]},{"type":"review","title":"Review and reply","sub":"The ticket on the left, the tags and the draft reply on the right.","yes":"Send reply","reasons":["Wrong product area","Wrong severity","Not a duplicate","I'll write this reply myself"]},{"type":"exceptions","items":[{"title":"Sunfield Rentals: severity","detail":"One user can't sign in after an SSO change. Nobody knows yet if others are affected.","options":["Treat as S1 and page on-call now","Treat as S3 until the customer replies","Call the customer's backup admin"],"rec":2,"tone":"check","why":"An S1 pages an engineer at night; a call settles the scope in minutes."},{"title":"Brindle Logistics: webhook errors","detail":"No known issue. Timing matches release 4.18.","options":["Escalate to on-call engineering","Wait for more tickets","Reply with a guess at the cause"],"rec":0,"tone":"bad","why":"A core workflow is down for an Enterprise customer."},{"title":"KI-112 reached three accounts","detail":"Marlow Outfitters, Greyling Cafés and one earlier this week.","options":["Escalate to engineering per the rule","Keep the planned fix date","Ask product to post a notice"],"rec":0,"tone":"check","why":"Your rule escalates a known issue when three accounts hit it in a week."}],"title":"Needs a decision","sub":"The assistant suggests; the team lead decides."},{"type":"compare","table":{"title":"Triaged queue","h":["Ticket","Customer","Area","Severity","Linked to"],"r":[["48211","Marlow Outfitters","Reporting","S3","KI-112","ok"],["Chat 08:21","Sunfield Rentals","Sign-in","? set by agent","—","check"],["48219","Pemberton Tiles","Billing","S3","Billing team","ok"],["48224","Greyling Cafés","Reporting","S3","48211, KI-112","ok"],["48230","Brindle Logistics","Integrations","S2","On-call engineer","bad"]]},"title":"Today's queue","sub":"Filter by status. Red rows are waiting on engineering."},{"type":"write","system":"Helpdesk (test copy)","records":[{"title":"Ticket 48211 · Marlow Outfitters","kv":[["Tags","Reporting, KI-112"],["Severity","S3"],["Reply","Sent by Theo"]],"status":"Updated","tone":"ok"},{"title":"Ticket 48224 · Greyling Cafés","kv":[["Linked","48211, KI-112"],["Severity","S3"]],"status":"Updated","tone":"ok"},{"title":"Ticket 48219 · Pemberton Tiles","kv":[["Assigned","Billing team"],["Refund","Billing decides"]],"status":"Reassigned","tone":"info"},{"title":"Ticket 48230 · Brindle Logistics","kv":[["Severity","S2"],["Escalated","On-call engineer"]],"status":"Escalated","tone":"bad"},{"title":"Known issue KI-112","kv":[["Accounts this week","3"],["Status","Escalated to engineering"]],"status":"Updated","tone":"check"}],"title":"Update the system","sub":"Tags, links and severities are saved as the agent confirmed them. Replies are sent by the agent.","cta":"Save to the helpdesk"},{"type":"report","doc":"Support triage summary · morning shift","sections":[{"h":"What came in","p":"Five items: four email tickets and one chat. Two share a known issue, one is billing, one needs engineering and one needs a call."},{"h":"Tickets by product area","chart":{"title":"Tickets","labels":["Reporting","Sign-in","Billing","Integrations"],"values":[2,1,1,1],"unit":"","prefix":"","tones":["ok","check","ok","bad"]}},{"h":"Known issues","table":{"title":null,"h":["Issue","Accounts this week","Status"],"r":[["KI-112 · large exports time out","3","Escalated to engineering"],["Webhook 401s (not yet an issue)","1","On-call engineer looking"]]}},{"h":"Follow-ups","list":["Agent calls Sunfield Rentals' backup admin to confirm how many users are locked out.","Update Brindle Logistics within the hour, as promised."]}],"title":"Shift summary","sub":"","subtitle":"Support · invented data","kpis":[[5,"Tickets and chats"],[4,"Replies sent by agents","ok"],[1,"Escalated","bad"],[1,"Severity set by a person","check"]],"format":"Shift summary"}],"next":["Tickets are read from your helpdesk and chat tool as they arrive.","Product areas, severities and workarounds come from lists your team keeps.","Agents send every reply; refunds and causes are confirmed by the right team.","Escalation rules (like three accounts in a week) are set by your support lead."],"unit":"Tickets triaged","industry":"Software and SaaS companies","ind":"saas","brand":{"name":"Acme Cloud","product":"Assistant","mark":"A"}}</script>
