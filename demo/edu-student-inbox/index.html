<script type="application/json" id="case">{"slug":"edu-student-inbox","title":"Student services inbox","tagline":"Students write in about fees, timetables and transcripts. The assistant sorts each message, answers routine questions from the college's published policies and routes the rest to the right office. Staff approve and send every reply.","area":"Student services","flow":{"start":"Student emails about fees, schedules and records","agent":"Sorts, answers from policy with a citation, routes the rest","person":"Reads, edits and sends every reply","end":"Answered or routed messages, logged on the student file"},"persona":{"name":"Tess Holloway","role":"Student services lead"},"docs":[{"name":"Payment plan question.eml","kind":"email","body":"Hi,\n\nIs it possible to pay my [[winter term fees|Topic]] in two parts instead of all at once?\n\nThanks,\nSienna Ward\nStudent ID [[2601487|Student]]","meta":"Email · Mon 08:05","to":"studentservices@acme-college.example","subject":"Can I split my winter fees?","label":"Sienna Ward · fees","sub":"Email · routine","fields":[["Type","Fees: payment plan","Message text"],["Student","Sienna Ward · 2601487","Student ID, college email",0.99],["Winter fees posted","$2,140.00","Student account"],["Answer from","Fee policy FP-3, section 2","Policy library"],["Route to","Student accounts (copy)","Routing rule 1: fees"]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Student found","Active, Business Administration, term 2","ok"],["Eligible for a plan","No balance owing from earlier terms","ok"],["Policy answer found","FP-3, section 2","ok"]]},"draft":{"text":"Hi Sienna,\n\nYes. Under our fee policy you can pay winter fees in two instalments: half by [[4 January 2027]] and the rest by [[1 February 2027]]. Please choose the payment plan option in the student portal by 15 December.\n\nStudent Services, Acme College","label":"Draft reply","alt":["Hi Sienna,\n\nGood news: a two-part payment plan is available for winter. The first half is due [[4 January 2027]] and the second [[1 February 2027]]. You can sign up in the student portal until 15 December.\n\nStudent Services, Acme College"],"to":"Sienna Ward"},"yes":"Send reply","from":"sienna.ward@students.acme-college.example"},{"name":"Timetable clash.eml","kind":"email","body":"Hello,\n\nMy winter timetable has [[ACC-1101 section 02|Course A]] and [[BUS-1150 section 01|Course B]] both on Tuesdays at 10:00. What should I do?\n\nJordan Price","meta":"Email · Mon 08:47","to":"studentservices@acme-college.example","subject":"Two classes at the same time","label":"Jordan Price · timetable","sub":"Email · identity to confirm","fields":[["Type","Timetable: clash","Message text"],["Student","?Jordan Price: two active students with this name (2600931, 2602215)","Personal email, not on file",0.45],["Course A","ACC-1101-02 · Tue 10:00","Winter timetable"],["Course B","BUS-1150-01 · Tue 10:00","Winter timetable"],["Other sections","BUS-1150-03 · Thu 13:00 · 4 seats open at 08:50","Winter timetable",0.85],["Route to","Student services","Routing rule 3: timetables"]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Clash confirmed","Both sections meet Tue 10:00","ok"],["Student identified","Two records match the name","check"],["Open section","BUS-1150-03 has seats","ok"]]},"flags":["The email came from a personal address. Nothing from the student record goes in the reply until the student confirms their ID.","Seat counts change through the day. The reply says seats were open, not that one is held."],"draft":{"text":"Hi Jordan,\n\nThanks for flagging the clash. Section 03 of BUS-1150 meets on [[Thursdays at 13:00]] and had seats open this morning. You can switch sections yourself in the student portal. If you'd like us to help, please reply from your college email or include your [[student ID]].\n\nStudent Services, Acme College","label":"Draft reply","alt":[],"to":"Jordan Price"},"yes":"Send reply","from":"jprice.home@mailbox.example"},{"name":"Official transcript request.eml","kind":"email","body":"Hi,\n\nCould you send an [[official transcript|Topic]] to Ridgeview Polytechnic? I'm applying for their degree program and the deadline is [[15 December|Deadline]].\n\nThanks,\nMalik Okafor-Reyes, ID [[2598840|Student]]","meta":"Email · Mon 09:20","to":"studentservices@acme-college.example","subject":"Official transcript to another college","label":"Malik Okafor-Reyes · transcript","sub":"Email · hold on account","fields":[["Type","Records: official transcript","Message text"],["Student","Malik Okafor-Reyes · 2598840","Student ID, college email",0.99],["Deadline","15 Dec 2026","Message text"],["Answer from","Records policy RP-1: requests, fees, holds","Policy library"],["Route to","Registrar's office (copy)","Routing rule 5: transcripts"]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Student found","Graduated June 2026, Accounting","ok"],["Holds on account","Library fine, $40.00","bad"],["Transcript fee","$15.00, paid at request","info"]]},"flags":[["bad","Your records policy withholds official transcripts while a hold is on the account. The reply explains how to clear it."],"Removing or waiving a hold is the registrar's decision."],"draft":{"text":"Hi Malik,\n\nThanks for your request. Before we can send an official transcript, a [[$40.00 library fine]] on your account needs to be cleared. Once it's paid, request the transcript in the student portal ($15.00) and choose Ridgeview Polytechnic as the recipient. Requests usually go out within five business days, so there's time before 15 December.\n\nStudent Services, Acme College","label":"Draft reply","alt":[],"to":"Malik Okafor-Reyes"},"yes":"Send reply","from":"m.okafor-reyes@students.acme-college.example"},{"name":"Final mark question - MKT-2204.eml","kind":"email","body":"Hello,\n\nIn [[MKT-2204|Course]] my rubric shows [[42/50|Rubric mark]] for the final project, but the gradebook shows [[32/50|Gradebook mark]]. I think it was entered wrong. Who do I talk to?\n\nAva Lindqvist, 2603312","meta":"Email · Mon 10:02","to":"studentservices@acme-college.example","subject":"My final project mark looks wrong","label":"Ava Lindqvist · grade question","sub":"Email · route to faculty","fields":[["Type","Grades: possible entry error","Message text"],["Student","Ava Lindqvist · 2603312","Student ID, college email",0.99],["Course","MKT-2204 · Digital Marketing, fall","Course list"],["Rubric mark","42/50 (student's copy)","Message text"],["Gradebook mark","32/50","Message text"],["Route to","Course faculty, copy program coordinator","Routing rule 8: grades"]],"table":{"title":"Checks","h":["Check","Result"],"r":[["Grade questions","Faculty only, per academic policy AP-2","info"],["Grade appeal window","10 business days from posting; mark posted Fri","ok"]]},"flags":[["info","The assistant doesn't look at or change marks. It routes the question and drafts an acknowledgement only."]],"draft":{"text":"Hi Ava,\n\nThanks for letting us know. We've passed your question about the MKT-2204 final project mark to your [[instructor and program coordinator]], who handle grade questions. They'll reply directly. Raising it now keeps you within the 10-business-day window under the academic policy.\n\nStudent Services, Acme College","label":"Acknowledgement","alt":[],"to":"Ava Lindqvist"},"yes":"Route and acknowledge","from":"ava.lindqvist@students.acme-college.example"}],"stages":[{"type":"upload","mode":"inbox","source":"Student services inbox","title":"Messages arrive","sub":"Email to studentservices@ from students and applicants."},{"type":"process","title":"Sorting and drafting","sub":"","steps":[["Reading each message","Email body and attachments"],["Sorting by type","Fees, timetables, records, grades"],["Identifying the student","College email or student ID; personal emails are not trusted"],["Finding the policy answer","Published fee, records and academic policies"],["Routing and drafting","Nothing is sent"]],"log":[["Jordan Price: two student records, ID needed","y",2],["2598840: library hold blocks official transcripts","y",3],["MKT-2204 grade question routed to faculty","g",4]]},{"type":"review","title":"Review and reply","sub":"The message on the left, the policy answer or routing on the right.","yes":"Send reply","reasons":["Needs a different office","Policy answer is wrong","Student must confirm identity","I'll answer this myself"]},{"type":"ask","qa":[{"q":"Can a student on a payment plan register for spring?","a":"Yes, as long as both winter instalments are paid on time. A missed instalment puts a hold on registration until it is paid.","cites":["Fee policy FP-3, section 2","Fee policy FP-3, section 5"]},{"q":"How long do official transcripts take?","a":"Up to five business days after the request is paid, if there are no holds on the account.","cites":["Records policy RP-1, section 3"]},{"q":"Can we change a student's grade if they show us the rubric?","a":"No. Only the course faculty can change a grade; student services routes the question.","cites":["Academic policy AP-2, section 1"]}],"title":"Ask the policy library","sub":"Staff ask; answers come only from the college's own policies, with the section cited."},{"type":"write","system":"Student information system (test copy)","records":[{"title":"Contact note · Sienna Ward · 2601487","kv":[["Topic","Payment plan"],["Reply","Sent by staff"]],"status":"Logged","tone":"ok"},{"title":"Contact note · Jordan Price · ID to confirm","kv":[["Topic","Timetable clash"],["Waiting on","Student ID"]],"status":"Logged, waiting","tone":"check"},{"title":"Contact note · Malik Okafor-Reyes · 2598840","kv":[["Topic","Official transcript"],["Blocked by","Library hold"]],"status":"Logged","tone":"bad"},{"title":"Referral · Ava Lindqvist · MKT-2204","kv":[["To","Course faculty, program coordinator"],["Opened","Mon 10:02"]],"status":"Routed","tone":"info"}],"title":"Update the system","sub":"Each message is logged on the student's file with the reply a pers
